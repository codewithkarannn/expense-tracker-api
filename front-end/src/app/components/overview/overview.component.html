<div class="flex flex-col md:flex-col justify-start gap-2 md:pb-2">

  <div class="w-full">
    <div class="flex justify-between  mb-4">
      <div>
        <div class="font-bold text-base">Recent Transactions</div>
        <div class="text-xs text-gray-500 font-medium">You made {{this.transactionCount}} transactions this
          month</div>
      </div>

    </div>

    <div class="flex flex-col gap-4">
      @for (transaction of transactionList; track transaction.transactionMasterId)
      {
      <app-transaction-card [transaction]="transaction" (deleteTransaction)="deleteTransaction($event)">
      </app-transaction-card>
      }
    </div>
    <div class="w-full flex justify-end mb-2 mt-2">
      <a (click)="navigateToAllTransactions()" class="text-xs font-semibold">View all transactions</a>
    </div>
  </div>
  <div class=" bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl p-6 text-white shadow-lg">
    <div class="text-lg font-bold mb-4 flex items-center gap-2  text-yellow-300">
      <nz-icon nzType="thunderbolt" nzTheme="fill"></nz-icon>
      Quick Actions
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">

      <!-- Add Transaction -->
      <button
        class="bg-white/20 hover:bg-white/30 rounded-xl p-4 transition-all duration-200 text-center group hover:scale-105 active:scale-95">
        <div class="flex flex-col items-center space-y-2">
          <div
            class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center group-hover:bg-white/30 transition-colors">
            <span nz-icon nzType="plus" nzTheme="outline" class="text-xl text-white"></span>
          </div>
          <span class="text-sm font-medium">Add Transaction</span>
        </div>
      </button>

      <!-- Show All Transactions -->
      <button
        class="bg-white/20 hover:bg-white/30 rounded-xl p-4 transition-all duration-200 text-center group hover:scale-105 active:scale-95">
        <div class="flex flex-col items-center space-y-2">
          <div
            class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center group-hover:bg-white/30 transition-colors">
            <span nz-icon nzType="unordered-list" nzTheme="outline" class="text-xl text-white"></span>
          </div>
          <span class="text-sm font-medium">All Transactions</span>
        </div>
      </button>

      <!-- View Reports -->
      <button
        class="bg-white/20 hover:bg-white/30 rounded-xl p-4 transition-all duration-200 text-center group hover:scale-105 active:scale-95">
        <div class="flex flex-col items-center space-y-2">
          <div
            class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center group-hover:bg-white/30 transition-colors">
            <span nz-icon nzType="bar-chart" nzTheme="outline" class="text-xl text-white"></span>
          </div>
          <span class="text-sm font-medium">View Reports</span>
        </div>
      </button>

      <!-- Set Budget -->
      <button
        class="bg-white/20 hover:bg-white/30 rounded-xl p-4 transition-all duration-200 text-center group hover:scale-105 active:scale-95">
        <div class="flex flex-col items-center space-y-2">
          <div
            class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center group-hover:bg-white/30 transition-colors">
            <span nz-icon nzType="wallet" nzTheme="outline" class="text-xl text-white"></span>
          </div>
          <span class="text-sm font-medium">Set Budget</span>
        </div>
      </button>

    </div>
  </div>
</div>
